title = Upscale extension

name = Upscale
description = Upscales RGB and multichannel images on the fly with OpenCV dnn_superres models (or bicubic interpolation as a control), for viewing and segmentation experiments.

menu.enhance = Enhance!
menu.enhance.options = Upscale...
menu.reset = Reset view

pref.category = Upscale extension
pref.folder.name = Model folder
pref.folder.description = Folder containing the dnn_superres model files, named like EDSR_x4.pb or ESPCN_x3.pb.
pref.pad.name = Tile overlap (source pixels)
pref.pad.description = Extra source pixels read around each tile to avoid seams. Larger networks (e.g. EDSR) need more.
pref.tile.name = Tile size (output pixels)
pref.tile.description = Preferred size of the upscaled tiles. Adjusted to a multiple of the scale.
pref.threads.name = OpenCV threads (0 = unchanged)
pref.threads.description = Sets the OpenCV thread count when an upscaled view is created. This is global to QuPath. Try 1 or 2 when many tiles are processed in parallel.

stage.title = Upscale

dialog.model.label = Model:
dialog.model.tooltip = dnn_superres models found in the model folder, plus bicubic interpolation as a control. EDSR is by far the slowest.
dialog.refresh.text = Refresh
dialog.refresh.tooltip = Scan the model folder again.
dialog.browse.text = Browse...
dialog.browse.title = Select any model file
dialog.browse.filter = dnn_superres models (*.pb)
dialog.browse.tooltip = Pick any model file. The model folder is inferred from it, so the other models in the same folder are found too.
dialog.folder = Model folder: %s
dialog.folder.none = No model folder set. Use Browse... or set it in Preferences (Upscale extension). Only the bicubic control is available for now.
dialog.displayed.text = Displayed channels only
dialog.displayed.tooltip = Process only the channels currently displayed in the viewer. Otherwise all channels are processed (much slower). Ignored for RGB images, which are upscaled as a whole.
dialog.backend.label = Backend:
dialog.backend.tooltip = Where the network runs. GPU backends are only listed if OpenCV reports a usable device; they may be slower than the CPU for small networks. Ignored for the bicubic control.
dialog.reset.text = Reset view
dialog.reset.tooltip = Put the original image back in the active viewer.
dialog.enhance.text = Enhance!
dialog.enhance.tooltip = Show an upscaled version of the image in the active viewer.

info.preparing = Preparing %s on %s for %s...
info.channels = %d channel(s)
info.rgb = an RGB image
info.not-upscaled = The active viewer is not showing an upscaled image.

error = Upscale extension error
error.gui-loading-failed = GUI loading failed
error.no-image = Open an image first.
error.no-channels = No channels selected. Display at least one channel, or untick "Displayed channels only".
error.no-model-selected = Select a model first.
error.no-model-folder = No model folder is set. Define it in Preferences (Upscale extension), or use Extensions > Upscale > Upscale... > Browse.
error.model-missing = The model file was not found: %s
error.failed = Could not create the upscaled image: %s
error.failed.gpu = The GPU backend may not be usable with this model or driver. Try the CPU backend.
error.set-image-failed = The viewer could not open the image: %s

menu.add-to-project = Add to project

info.added-to-project = Added "%s" to the project. It is rebuilt from the source image and the model when opened, so the model folder must be set on that machine.

error.no-project = Open a project first.
error.add-to-project-failed = Could not add the image to the project: %s
error.model-unavailable = The model "%s" was not found in the model folder (%s). Set the model folder in Preferences (Upscale extension).

pref.after.name = After enhancing
pref.after.description = What to do with the open project when an upscaled image is shown: ask whether to add it as a new project entry, do nothing (use Extensions > Upscale > Add to project when wanted), or add it automatically. Has no effect without an open project.
pref.after.ask = Ask to save
pref.after.never = Do nothing
pref.after.always = Save automatically

ask.add-to-project = Add the upscaled image "%s" to the project as a new entry?
info.already-in-project = "%s" is already in the project, so no new entry was added.